[project]
name = "tts"
version = "0.1.1"
description = "STArK: Towards Synthesizing Articulatory Kinematics from Text (Interspeech 2026)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "huggingface-hub",
    "hydra-core>=1.3.2",
    "ipykernel",
    "ipywidgets>=8.1.8",
    "librosa",
    "lightning>=2.6.0",
    "matplotlib",
    "numpy",
    "onnxruntime-gpu>=1.24.2",
    "phonemizer>=3.2.1",
    "pyyaml",
    "requests>=2.32.5",
    "rotary-embedding-torch",
    "scipy",
    "soundfile",
    "tensorboard",
    "tgt",
    "torch<2.9",
    "torchaudio<2.9",
    "torchcrepe",
    "torchmetrics>=1.8.2",
    "tqdm",
    "transformers",
    "tslearn>=0.8.0",
]

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
tts = { path = ".", editable = true }

[tool.pixi.dependencies]
python = ">=3.11,<3.13"
# espeak-ng itself isn't packaged on conda-forge (checked — no espeak-ng/espeak/libespeak*
# package on conda-forge, bioconda, or any channel indexed by anaconda.org, and no
# conda-forge/espeak-ng-feedstock exists). These are the *build toolchain* to compile it from
# its official source instead (see the build-espeak-ng task below) — trusting the actively
# maintained espeak-ng/espeak-ng upstream directly rather than a third-party bundled-binary
# wrapper package.
cmake = ">=3.10"
c-compiler = "*"
cxx-compiler = "*"
git = "*"
make = "*"

[tool.pixi.tasks]
build-espeak-ng = { cmd = "bash scripts/build_espeak_ng.sh" }
